# Keeps the Render free-tier backend (dinemind-backend) from cold-starting.
#
# Render spins a free web service down after ~15 minutes of inactivity, and waking this one
# takes ~40 seconds - it imports torch and sentence-transformers on boot. The frontend loads
# instantly from Vercel, so a visitor fills in the sign-up form and then waits ~40s with no
# feedback, which reads as broken rather than as a free-tier tradeoff.
#
# Pinging /health every 10 minutes keeps the instance up. /health only opens a pooled
# connection and runs `select 1`, so this costs no model or provider quota.
#
# Two limits shape the schedule below:
#
#   Render gives 750 instance-hours per month across ALL free services in the workspace.
#   The stock-research backend runs an identical keep-warm workflow, so the budget is
#   split: ~11 hours a day each is ~334 h/service, ~668 h total, leaving ~80 h of headroom
#   under 750. Both workflows use the same 12:00-22:59 UTC window on purpose - changing one
#   is an obvious prompt to change the other.
#
#   GitHub's scheduled runs are best-effort. They are frequently late by 5-15 minutes and
#   can be dropped entirely when the platform is busy, so a 10-minute interval against a
#   15-minute idle timeout is deliberately tight: a single skipped run should not be enough
#   to let the service sleep.

name: Keep backend warm

on:
  schedule:
    # Every 10 minutes, 12:00-22:59 UTC. That window covers roughly 17:30 IST - 04:40 IST
    # and 08:00-19:00 US Eastern, i.e. Indian evening/night plus the full US workday.
    # Widening it means eating into the shared 750 h budget - read the hours note above.
    - cron: "*/10 12-22 * * *"
  workflow_dispatch: # lets you wake it manually before sharing the link

# If a run is somehow still going when the next fires, the newer one is what matters.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          URL="https://dinemind-backend.onrender.com/health"

          # --max-time 120 because a cold start legitimately takes ~40s and can take longer
          # under load. A shorter timeout would report failure for a service that is simply
          # waking up, which is exactly the case this workflow exists to handle.
          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' --max-time 120 "$URL") || {
            echo "::error::curl failed to reach $URL"
            exit 1
          }

          echo "HTTP $code"
          cat /tmp/body.txt
          echo

          # /health returns 503 with {"status":"degraded"} if the database is unreachable.
          # That still means the web service itself is awake, but it is worth failing the
          # run so the notification surfaces a genuinely broken deploy.
          if [ "$code" != "200" ]; then
            echo "::error::Expected 200 from $URL, got $code"
            exit 1
          fi
