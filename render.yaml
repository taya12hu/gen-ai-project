services:
  - type: web
    name: gen-ai-project-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Point these at your existing pgvector-enabled Postgres instance
      # (wherever the restaurant/review data was ingested) - set in the
      # Render dashboard, not committed here.
      - key: PGHOST
        sync: false
      - key: PGPORT
        value: "5432"
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      # Bounds both the connection pool and the request threadpool (see
      # app/storage/db.py and the lifespan hook in app/api/main.py), so the
      # server never admits more concurrent DB work than it has connections
      # for. Keep it well under the Postgres instance's own connection limit
      # once more than one app instance runs.
      - key: DB_MAX_CONNECTIONS
        value: "16"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      # Cross-encoder reranking. Deliberately off here: it costs ~2s per vibe
      # query and ~90MB of resident memory for a second model, which the free
      # tier - already needing a CPU-only torch pin to fit - cannot spare.
      - key: RERANK_ENABLED
        value: "0"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      # Set to your deployed Vercel frontend URL (e.g. https://your-app.vercel.app)
      - key: FRONTEND_URL
        sync: false
